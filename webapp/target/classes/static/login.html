<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 请销假管理系统 v2.0</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo-mark">假</div>
            <h1>请销假管理系统</h1>
            <p class="login-subtitle">行政事业单位 · v2.0</p>

            <div id="jsErrLog" style="background:var(--danger-bg);color:var(--danger);font-size:12px;padding:10px 14px;margin-bottom:16px;border-radius:3px;border-left:3px solid var(--danger);display:none;"></div>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUser" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPass" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-gold btn-block" style="height:38px;margin-top:8px;font-size:14px;">登 录</button>
                <div id="loginMsg" class="login-msg"></div>
            </form>

            <div class="login-tip">
                <strong>默认账号</strong><br>
                admin / admin123 &nbsp;·&nbsp; operator / operator123 &nbsp;·&nbsp; viewer / viewer123
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            var el = document.getElementById('jsErrLog');
            if (el) { el.style.display = 'block'; el.textContent = 'JS 错误: ' + e.message; }
        });
    </script>
    <script src="/js/common.js"></script>
    <script>
        (function() {
            var errEl = document.getElementById('jsErrLog');
            function logErr(msg) { if (errEl) { errEl.style.display = 'block'; errEl.textContent = msg; } }

            if (typeof fetch === 'undefined') { logErr('浏览器不支持 fetch API, 请使用 Edge/Chrome'); return; }
            if (typeof Auth === 'undefined') { logErr('common.js 加载失败'); return; }

            var form = document.getElementById('loginForm');
            var msgEl = document.getElementById('loginMsg');
            if (!form) { logErr('未找到 loginForm'); return; }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                msgEl.textContent = '';
                var username = document.getElementById('loginUser').value.trim();
                var password = document.getElementById('loginPass').value;
                if (!username || !password) { msgEl.textContent = '请输入用户名和密码'; return; }
                var btn = form.querySelector('button[type=submit]');
                btn.disabled = true;
                btn.textContent = '登录中...';

                Auth.login(username, password).then(function(r) {
                    if (r.success) {
                        window.location.href = '/dashboard.html';
                    } else {
                        msgEl.textContent = r.message || '登录失败';
                        btn.disabled = false;
                        btn.textContent = '登 录';
                    }
                }).catch(function(err) {
                    msgEl.textContent = (err && err.message) ? err.message : '登录失败';
                    btn.disabled = false;
                    btn.textContent = '登 录';
                });
            });

            Auth.checkLogged().catch(function() {});
        })();
    </script>
</body>
</html>
