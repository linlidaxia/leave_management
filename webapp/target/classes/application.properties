# ==================== 服务配置 ====================
server.port=9000
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.application.name=leave-management

# ==================== SQLite 数据库 ====================
# 数据库文件存放在 jar 同目录 (运行时工作目录)
spring.datasource.url=jdbc:sqlite:data.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# SQLite 不支持传统的连接池验证查询, 关闭 keepalive
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# ==================== 初始化 SQL ====================
# 启动时执行 schema.sql 和 data.sql (使用 IF NOT EXISTS, 安全可重复执行)
# continue-on-error=true: 允许 ALTER TABLE ADD COLUMN 在列已存在时静默失败
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ==================== JdbcTemplate ====================
spring.jdbc.template.query-timeout=30

# ==================== 文件上传 (备份恢复) ====================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==================== Session ====================
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true

# ==================== 日志 ====================
logging.level.root=INFO
logging.level.com.leavemgmt=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
